# Webpagina als ConfigMap; waarden tussen dubbele accolades komen uit values.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-html
  labels:
    app: {{ .Release.Name }}
data:
  index.html: |
    <h1>{{ .Values.message }}</h1>
    <p>Omgeving: {{ .Values.environment }}</p>
    <p>Release: {{ .Release.Name }} | Replicas: {{ .Values.replicaCount }}</p>
